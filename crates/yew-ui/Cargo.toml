[package]
name = "yew-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
core-sim = { path = "../core-sim" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["File", "FileReader", "HtmlInputElement", "Event"] }
gloo = { version = "0.11", features = ["timers","storage","dialogs","console","file"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen-futures = "0.4"

# Optional: use console_error_panic_hook during dev
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
