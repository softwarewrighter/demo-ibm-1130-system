[package]
name = "yew-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
gloo = { version = "0.11", features = ["timers","storage","dialogs","console"] }
serde = { version = "1.0", features = ["derive"] }

# Optional: use console_error_panic_hook during dev
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
