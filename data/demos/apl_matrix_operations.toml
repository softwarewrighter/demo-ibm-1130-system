      A +.× B
 30  24  18
 84  69  54
138 114  90

      ⍉A
1 4 7
2 5 8
3 6 9

      +/,A
45
"""

[emulator]
# Requirements for running this demo
memory_words = 8192
disk_sectors = 200
requires_apl_system = true

# Link to download utility (not included in repo)
download_utility = "scripts/download_apl1130.sh"

[educational]
topics = ["array programming", "matrix operations", "APL syntax", "mathematical notation"]
prerequisites = ["Basic matrix algebra", "Understanding of array indexing"]
learning_objectives = [
    "Understand APL's array-oriented approach",
    "Learn basic APL operators and syntax",
    "See the power of concise mathematical notation"
]

