# APL Matrix Operations Demo (Placeholder)
# This is a placeholder for educational demo content

[demo]
id = "apl_matrix_operations"
title = "APL Matrix Operations"
language = "APL"
difficulty = "beginner"
estimated_runtime_ms = 100

description = """
This demo showcases APL's powerful array processing capabilities through \
matrix arithmetic operations. APL (A Programming Language) was revolutionary \
for its concise mathematical notation and right-to-left evaluation.

Key concepts demonstrated:
- Array creation with reshape (⍴) and index (⍳)
- Element-wise operations
- Matrix multiplication with inner product (+.×)
- Transpose operation (⍉)
- Reduction operations (+/)
"""

[source]
# NOTE: Actual APL\1130 software requires download via utility scripts
# This placeholder uses example code for UI demonstration
code = """
      ⍝ Create a 3×3 matrix with values 1-9
      A ← 3 3 ⍴ ⍳9

      ⍝ Create another 3×3 matrix
      B ← 3 3 ⍴ 9 8 7 6 5 4 3 2 1

      ⍝ Add matrices element-wise
      A + B

      ⍝ Matrix multiplication (inner product)
      A +.× B

      ⍝ Transpose matrix A
      ⍉A

      ⍝ Sum all elements
      +/,A
"""

expected_output = """
      A ← 3 3 ⍴ ⍳9
      A
1 2 3
4 5 6
7 8 9

      B ← 3 3 ⍴ 9 8 7 6 5 4 3 2 1
      B
9 8 7
